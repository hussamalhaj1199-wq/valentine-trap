<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Valentine 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Comic Sans MS", "Segoe UI", cursive;
    overflow: hidden;
  }

  .card {
    background: white;
    padding: 40px 30px;
    border-radius: 20px;
    text-align: center;
    width: 340px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position: relative;
    animation: pop 0.8s ease;
  }

  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #e91e63;
    margin-bottom: 30px;
  }

  .buttons {
    position: relative;
    height: 120px;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  #yes {
    background: #e91e63;
    color: white;
    z-index: 2;
  }

  #yes:hover {
    transform: scale(1.1);
  }

  #no {
    background: #ffcdd2;
    color: #b71c1c;
    position: absolute;
    left: 160px;
    top: 20px;
  }

  .message {
    display: none;
    font-size: 22px;
    color: #e91e63;
    margin-top: 20px;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .heart {
    position: fixed;
    color: #e91e63;
    font-size: 20px;
    animation: floatUp 4s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
  }
</style>
</head>

<body>

<div class="card">
  <h1 id="question">Lamis, would you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 🙃</button>
  </div>

  <div class="message" id="finalMessage">
    See you on the 14th, gorgeous 💕
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const message = document.getElementById("finalMessage");
  const question = document.getElementById("question");

  function moveNo() {
    const card = document.querySelector(".card");
    const maxX = card.offsetWidth - noBtn.offsetWidth;
    const maxY = card.offsetHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  yesBtn.addEventListener("click", () => {
    question.style.display = "none";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    message.style.display = "block";

    for (let i = 0; i < 20; i++) {
      createHeart();
    }
  });

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }
</script>

</body>
</html>
